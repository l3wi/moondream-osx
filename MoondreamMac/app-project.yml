name: MoondreamMacApp
options:
  bundleIdPrefix: com.moondream
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  MoondreamMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/MoondreamMac
        excludes:
          - "**/*.xcassets"
      - path: Sources/MoondreamMac/Assets.xcassets
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleIconName: AppIcon
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moondream.mac
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
