name: MoondreamMac
options:
  bundleIdPrefix: com.moondream
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift.git
    from: "0.21.0"
  mlx-swift-examples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    from: "2.21.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.0.0"
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    from: "1.0.0"
  jinja:
    url: https://github.com/johnmai-dev/Jinja.git
    from: "1.0.0"

targets:
  MoondreamCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MoondreamCore
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift
        product: MLXFast
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift-examples
        product: MLXVLM
      - package: mlx-swift-examples
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub
      - package: swift-transformers
        product: Tokenizers
    settings:
      SWIFT_VERSION: "6.0"

  MoondreamMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/MoondreamMac
        excludes:
          - "**/*.xcassets"
      - path: Sources/MoondreamMac/Assets.xcassets
    dependencies:
      - target: MoondreamCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift
        product: MLXFast
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift-examples
        product: MLXVLM
      - package: mlx-swift-examples
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub
      - package: swift-transformers
        product: Tokenizers
    info:
      path: App/Info.plist
      properties:
        CFBundleIconName: AppIcon
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.moondream.mac
      SWIFT_VERSION: "6.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
      GENERATE_INFOPLIST_FILE: false
